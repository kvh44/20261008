spring:
  main:
    lazy-initialization: true
  datasource:
    url: ${LOCAL_DB_URL:jdbc:mysql://localhost:3306/appdb}
    username: ${LOCAL_DB_USERNAME:appuser}
    password: ${LOCAL_DB_PASSWORD:apppassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
      jakarta:
        persistence:
          database-product-name: MySQL
          database-major-version: ${LOCAL_DB_MAJOR_VERSION:8}
          database-minor-version: ${LOCAL_DB_MINOR_VERSION:4}
